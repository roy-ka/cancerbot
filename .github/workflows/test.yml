name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --no-cache --pull -t cancerbot:${{ github.sha }} .

      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cancerbot:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Trivy downloads its vulnerability DB from mirror.gcr.io and only falls
      # back to its other default (GHCR) on errors it classifies as temporary;
      # a plain 403 from the mirror fails the scan outright. Retry once against
      # other registries. Real findings still fail: the retry finds them too.
      - name: Retry Trivy scan with alternate DB registries
        if: steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: cancerbot:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      EMBED_MODEL_NAME: nomic-embed-text
      GROQ_MODEL_NAME: openai/gpt-oss-120b
      GROQ_API_KEY: test-groq-key-not-real
      ENV: test
      SENDGRID_API_KEY: ""
      BREVO_API_KEY: ""
      AXIOM_TOKEN_WRITE: ""
      AXIOM_TOKEN_READ: ""
      AXIOM_DATASET: ""
      RERANK_ENABLED: "false"
      OPENSEARCH_CA_CERT: ""
      NINJA_EMAIL: ninja-test@example.com
      NINJA_PASSWORD: test-ninja-password
      REDIS_PASSWORD: test-redis-password
      REDIS_URL: redis://:test-redis-password@localhost:6379/0
      DEV_EMAIL_SHORTCUTS: "false"
      OLLAMA_GEN_MODEL: ""
      ADMIN_DIGEST_EMAILS: admin-test@example.com
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install backup script dependencies
        run: pip install -r requirements-backup.txt

      - name: Run tests
        run: pytest --tb=short -v

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=src --cov-report=term-missing --tb=short -v

  nlp-service-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nlp_service/requirements-test.txt

      - name: Install extraction dependencies
        working-directory: nlp_service
        run: pip install -r requirements-test.txt

      - name: Install scispacy (--no-deps, same as nlp_service/Dockerfile)
        run: pip install --no-deps scispacy==0.5.5

      - name: Run tests
        working-directory: nlp_service
        run: pytest --tb=short -v

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Unit tests
        working-directory: client
        run: npm test

      - name: Type check and build
        working-directory: client
        run: npm run build
