name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t cancerbot:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cancerbot:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      EMBED_MODEL_NAME: nomic-embed-text
      HUGGINGFACE_API_KEY: test-hf-key-not-for-production
      GROQ_MODEL_NAME: llama-3.3-70b-versatile
      ENV: test
      SENDGRID_API_KEY: ""
      AXIOM_TOKEN: ""
      AXIOM_DATASET: ""
      OPENSEARCH_CA_CERT: ""
      NINJA_EMAIL: ninja-test@example.com
      NINJA_PASSWORD: test-ninja-password
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -v

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=src --cov-report=term-missing --tb=short -v
