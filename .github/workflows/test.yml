name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --no-cache --pull -t cancerbot:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cancerbot:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      EMBED_MODEL_NAME: nomic-embed-text
      GROQ_MODEL_NAME: openai/gpt-oss-120b
      ENV: test
      SENDGRID_API_KEY: ""
      BREVO_API_KEY: ""
      AXIOM_TOKEN_WRITE: ""
      AXIOM_TOKEN_READ: ""
      AXIOM_DATASET: ""
      RERANK_ENABLED: "false"
      OPENSEARCH_CA_CERT: ""
      NINJA_EMAIL: ninja-test@example.com
      NINJA_PASSWORD: test-ninja-password
      REDIS_PASSWORD: test-redis-password
      REDIS_URL: redis://:test-redis-password@localhost:6379/0
      MAX_USERS: ""
      ADMIN_DIGEST_EMAILS: admin-test@example.com
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install backup script dependencies
        run: pip install -r requirements-backup.txt

      - name: Run tests
        run: pytest --tb=short -v

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=src --cov-report=term-missing --tb=short -v

  nlp-service-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nlp_service/requirements-test.txt

      - name: Install extraction dependencies
        working-directory: nlp_service
        run: pip install -r requirements-test.txt

      - name: Install scispacy (--no-deps, same as nlp_service/Dockerfile)
        run: pip install --no-deps scispacy==0.5.5

      - name: Run tests
        working-directory: nlp_service
        run: pytest --tb=short -v
