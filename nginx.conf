server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/cancer-bot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cancer-bot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Shared proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth endpoints
    location /auth/ {
        proxy_pass http://localhost:8000;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://localhost:8000;
    }

    # Conversations (REST + WebSocket)
    location /conversations/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Terms endpoints
    location /terms/ {
        proxy_pass http://localhost:8000;
    }

    # Bug reports
    location /bug-reports/ {
        proxy_pass http://localhost:8000;
    }

    # Health profile (onboarding)
    location /profile/ {
        proxy_pass http://localhost:8000;
    }

    # Ninja (admin) endpoints
    location /ninja/ {
        proxy_pass http://localhost:8000;
    }

    # Public read-only shared-conversation API. The public-facing page that
    # renders it lives at the frontend route /s/:token instead — not here —
    # since this whole prefix proxies straight to the backend and would
    # never fall through to the SPA's index.html.
    location /shared/ {
        proxy_pass http://localhost:8000;
    }

    # Frontend (catch-all, last)
    # __PROJECT_DIR__ is replaced with the checkout's real path when the file
    # is installed (scripts/deploy.sh, scripts/setup-nginx.sh), so the same
    # file works wherever and under whichever user the repo lives.
    root __PROJECT_DIR__/client/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
