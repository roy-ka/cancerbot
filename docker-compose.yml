services:
  opensearch-node1:
    image: opensearchproject/opensearch:3
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - node.roles=cluster_manager,data,ingest
      # One node: the production server has 4GB RAM in total, shared with
      # the backend, worker, NLP service, PostgreSQL, Redis and Ollama.
      # Indices are created with 0 replicas to match (db_connector.py).
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Local development: plain HTTP, no auth, no certificates.
      # docker-compose.prod.yml turns the security plugin and TLS back on.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '127.0.0.1:9200:9200'
      - '127.0.0.1:9600:9600'
    volumes:
      - os-data1:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [osnet]

  dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch-node1:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - '127.0.0.1:5601:5601'
    depends_on:
      - opensearch-node1
    networks: [osnet]

  postgres:
    image: postgres:16
    container_name: cancerbot-postgres
    environment:
      POSTGRES_DB: cancerbot
      POSTGRES_USER: cancerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cancerbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cancerbot -d cancerbot']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [osnet]

  redis:
    profiles: ['prod']
    image: redis:7-alpine
    container_name: cancerbot-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cancerbot_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [osnet]

  nlp-service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ENV: production
    ports:
      - '127.0.0.1:8100:8100'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8100/health\")" || exit 1',
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [osnet]

  backend:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    env_file: .env
    environment:
      ENV: production
      POSTGRES_URL: 'postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      OPENSEARCH_URL: 'http://opensearch-node1:9200'
      OLLAMA_URL: 'http://172.30.0.1:11434'
      NLP_SERVICE_URL: 'http://nlp-service:8100'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379/0'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")" || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - osnet

  worker:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    command: arq src.worker.WorkerSettings
    env_file: .env
    environment:
      ENV: production
      POSTGRES_URL: 'postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      OPENSEARCH_URL: 'http://opensearch-node1:9200'
      OLLAMA_URL: 'http://172.30.0.1:11434'
      NLP_SERVICE_URL: 'http://nlp-service:8100'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379/0'
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osnet

volumes:
  os-data1:
  cancerbot_pgdata:
  cancerbot_redisdata:

networks:
  osnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
