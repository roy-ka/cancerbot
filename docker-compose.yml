services:
  opensearch-node1:
    image: opensearchproject/opensearch:3
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - node.roles=cluster_manager,data,ingest
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.http.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=certs/root-ca.pem
      - plugins.security.ssl.transport.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.transport.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=certs/root-ca.pem
      - plugins.security.nodes_dn=CN=opensearch-node1
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '127.0.0.1:9200:9200'
      - '127.0.0.1:9600:9600'
    volumes:
      - os-data1:/usr/share/opensearch/data
      - ./certs/opensearch:/usr/share/opensearch/config/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf --insecure -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [osnet]

  opensearch-node2:
    image: opensearchproject/opensearch:3
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - node.roles=cluster_manager,data,ingest
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.http.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=certs/root-ca.pem
      - plugins.security.ssl.transport.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.transport.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=certs/root-ca.pem
      - plugins.security.nodes_dn=CN=opensearch-node1
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os-data2:/usr/share/opensearch/data
      - ./certs/opensearch:/usr/share/opensearch/config/certs:ro
    networks: [osnet]

  dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch-node1:9200"]
    ports:
      - '127.0.0.1:5601:5601'
    depends_on:
      - opensearch-node1
      - opensearch-node2
    networks: [osnet]

  postgres:
    image: postgres:16
    container_name: cancerbot-postgres
    environment:
      POSTGRES_DB: cancerbot
      POSTGRES_USER: cancerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cancerbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cancerbot -d cancerbot']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [osnet]

  nlp-service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ENV: production
    ports:
      - '127.0.0.1:8100:8100'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8100/health\")" || exit 1',
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [osnet]

  backend:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    env_file: .env
    environment:
      ENV: production
      POSTGRES_URL: 'postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      OPENSEARCH_URL: 'https://opensearch-node1:9200'
      OLLAMA_URL: 'http://172.30.0.1:11434'
      NLP_SERVICE_URL: 'http://nlp-service:8100'
    ports:
      - '8000:8000'
    volumes:
      - ./certs/opensearch/root-ca.pem:/app/certs/opensearch/root-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")" || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - osnet

  url-classifier:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    cap_drop:
      - ALL
    command: python -m src.workers.url_classifier
    env_file: .env
    environment:
      ENV: production
      POSTGRES_URL: 'postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      OPENSEARCH_URL: 'https://opensearch-node1:9200'
      OLLAMA_URL: 'http://172.30.0.1:11434'
      URL_CLASSIFIER_POLL_INTERVAL: '10'
    volumes:
      - ./certs/opensearch/root-ca.pem:/app/certs/opensearch/root-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    networks:
      - osnet

volumes:
  os-data1:
  os-data2:
  cancerbot_pgdata:

networks:
  osnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
