<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Crab reading a book" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Crab reading a book — send icon</title>

  <!-- eye stalks -->
  <g stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="38" y1="42" x2="34" y2="24"/>
    <line x1="62" y1="42" x2="66" y2="24"/>
  </g>
  <circle cx="34" cy="20" r="5" fill="#F5EDE0"/>
  <circle cx="66" cy="20" r="5" fill="#F5EDE0"/>
  <circle cx="34" cy="20" r="2" fill="#10243A"/>
  <circle cx="66" cy="20" r="2" fill="#10243A"/>

  <!-- shell / body -->
  <ellipse cx="50" cy="55" rx="28" ry="20" fill="#E8432A" stroke="#F5EDE0" stroke-width="3.5"/>

  <!-- claws -->
  <path d="M22 58 Q8 50 10 38 Q20 42 26 52 Z" fill="#E8432A" stroke="#F5EDE0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 58 Q92 50 90 38 Q80 42 74 52 Z" fill="#E8432A" stroke="#F5EDE0" stroke-width="3" stroke-linejoin="round"/>

  <!-- legs -->
  <g stroke="#F5EDE0" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M24 66 Q14 70 8 78"/>
    <path d="M76 66 Q86 70 92 78"/>
  </g>

  <!-- little open book, held up in front of the shell -->
  <path d="M34 62 Q50 54 66 62 L66 78 Q50 70 34 78 Z" fill="#F5EDE0" stroke="#10243A" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="50" y1="58" x2="50" y2="74" stroke="#10243A" stroke-width="2.5"/>

  <!-- page text lines -->
  <g stroke="#10243A" stroke-width="1.5" stroke-linecap="round">
    <line x1="38" y1="64" x2="46" y2="62"/>
    <line x1="38" y1="69" x2="46" y2="67"/>
    <line x1="54" y1="62" x2="62" y2="64"/>
    <line x1="54" y1="67" x2="62" y2="69"/>
  </g>
</svg>
