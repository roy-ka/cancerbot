<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Crab searching through books" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Crab searching through books — loading animation</title>

  <!-- ================= background book stack (idle, subtly pulsing) ================= -->
  <g>
    <rect x="14" y="104" width="34" height="10" rx="2" fill="#4A6184" stroke="#F5EDE0" stroke-width="1.5"/>
    <rect x="17" y="96" width="30" height="9" rx="2" fill="#E8432A" stroke="#F5EDE0" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= crab + active book, gently bobbing as a group ================= -->
  <g id="crab-group">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>

    <!-- eye stalks: scan left / right, like scanning a page -->
    <g id="eyes">
      <animateTransform attributeName="transform" type="rotate" values="-6 78 55; 6 78 55; -6 78 55" dur="1.8s" repeatCount="indefinite"/>
      <g stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="66" y1="42" x2="62" y2="18"/>
        <line x1="90" y1="42" x2="94" y2="18"/>
      </g>
      <circle cx="62" cy="14" r="5.5" fill="#F5EDE0"/>
      <circle cx="94" cy="14" r="5.5" fill="#F5EDE0"/>
      <circle cx="62" cy="14" r="2.2" fill="#10243A"/>
      <circle cx="94" cy="14" r="2.2" fill="#10243A"/>
    </g>

    <!-- shell / body -->
    <ellipse cx="78" cy="55" rx="27" ry="19" fill="#E8432A" stroke="#F5EDE0" stroke-width="3.5"/>

    <!-- left claw, resting on the page -->
    <path d="M52 62 Q38 56 40 44 Q50 48 56 58 Z" fill="#E8432A" stroke="#F5EDE0" stroke-width="3" stroke-linejoin="round"/>

    <!-- right claw, tapping/turning the page -->
    <g style="transform-box:fill-box; transform-origin: bottom left;">
      <animateTransform attributeName="transform" type="rotate" values="0;-18;0" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
      <path d="M104 62 Q118 56 116 44 Q106 48 100 58 Z" fill="#E8432A" stroke="#F5EDE0" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- legs -->
    <g stroke="#F5EDE0" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M54 70 Q44 74 38 82"/>
      <path d="M102 70 Q112 74 118 82"/>
    </g>

    <!-- open book being read -->
    <g id="book">
      <!-- left page (static) -->
      <path d="M78 80 Q60 74 46 82 L46 104 Q60 96 78 100 Z" fill="#F5EDE0" stroke="#10243A" stroke-width="2"/>
      <g stroke="#10243A" stroke-width="1.2" stroke-linecap="round">
        <line x1="52" y1="86" x2="64" y2="83"/>
        <line x1="52" y1="91" x2="64" y2="88"/>
        <line x1="52" y1="96" x2="64" y2="93"/>
      </g>

      <!-- spine -->
      <line x1="78" y1="80" x2="78" y2="100" stroke="#10243A" stroke-width="2.5"/>

      <!-- right page: flips shut and back open, anchored at the spine -->
      <g style="transform-box:fill-box; transform-origin: left center;">
        <animateTransform attributeName="transform" type="scale" values="1,1; 0.06,1; 1,1" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
        <path d="M78 80 Q96 74 110 82 L110 104 Q96 96 78 100 Z" fill="#F5EDE0" stroke="#10243A" stroke-width="2"/>
        <g stroke="#10243A" stroke-width="1.2" stroke-linecap="round">
          <line x1="86" y1="86" x2="98" y2="83"/>
          <line x1="86" y1="91" x2="98" y2="88"/>
          <line x1="86" y1="96" x2="98" y2="93"/>
        </g>
      </g>
    </g>
  </g>
</svg>
